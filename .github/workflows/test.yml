# Run repository checks and application tests.
# When you add, remove, or rename an application in apps/, update the `app` options in test.yml, build.yml, and release.yml.
# `npm run check:workflows` and the `plan` job stop when the lists differ from apps/.

name: Tests
run-name: Tests (${{ github.event_name }}, app=${{ inputs.app || 'all' }}, dry_run=${{ inputs.dry_run == true }})

on:
  pull_request:
    # `edited` runs only pr-rules again after a change to the title or description.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      app:
        description: Application directory in apps/, or all
        type: choice
        required: true
        default: all
        options:
          - all
          - moveToRepo
          - reCast
          - reHistory
      dry_run:
        description: Show the plan only. Do not install or run tests.
        type: boolean
        required: true
        default: false
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      dry_run:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  plan:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.select.outputs.apps }}
      selected: ${{ steps.select.outputs.selected }}
      dry_run: ${{ steps.select.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request needs the history to find the changed applications.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # On a pull request, only the applications with changed files are tested. A change outside apps/<directory>/ selects all applications.
      - id: select
        name: Select applications
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          APP: ${{ inputs.app || 'all' }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: node scripts/ci/apps.mjs select

  repository:
    needs: plan
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check:config
      - run: npm run check:workflows

  pr-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The script uses only Node.js built-in modules, so it needs no npm ci.
      - name: Check pull request rules
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/ci/pr-rules.mjs

  test:
    needs: plan
    if: needs.plan.outputs.dry_run != 'true'
    name: test (${{ matrix.app.dir }}, ${{ matrix.os }}, Node.js ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['26']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      WORKSPACE: ${{ matrix.app.name }}
      SELECTED: ${{ contains(fromJSON(needs.plan.outputs.selected), matrix.app.dir) }}
    # Every matrix job runs, so that each `test (…)` check reports a result for required status checks.
    # A job for an application that the pull request does not change skips all steps after this note and succeeds.
    steps:
      - name: Report a skipped application
        if: env.SELECTED != 'true'
        run: echo "Приложение не изменено в этом pull request. Тесты пропущены."
      - if: env.SELECTED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.SELECTED == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # reHistory tests need a newer Git than the Linux runner image provides.
      - name: Build pinned modern Git on Linux
        if: env.SELECTED == 'true' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          build_dir="$(mktemp -d)"
          cd "$build_dir"
          curl --fail --silent --show-error --location https://www.kernel.org/pub/software/scm/git/git-2.56.0.tar.xz -o git.tar.xz
          echo '26c56c296b38c0695b26fa95f475f1d01704d2d38e73465ca30b0b2f5dc789d3  git.tar.xz' | sha256sum --check
          tar -xf git.tar.xz
          make -C git-2.56.0 -j2 prefix="$build_dir/install" NO_RUST=YesPlease NO_CURL=YesPlease NO_OPENSSL=YesPlease NO_TCLTK=YesPlease NO_GETTEXT=YesPlease NO_PERL=YesPlease NO_PYTHON=YesPlease install
          echo "$build_dir/install/bin" >> "$GITHUB_PATH"
      - if: env.SELECTED == 'true'
        run: node --version && npm --version && git --version
      - if: env.SELECTED == 'true'
        run: npm ci --ignore-scripts
      - name: Test the application
        if: env.SELECTED == 'true'
        run: npm test --workspace "$WORKSPACE"
      - name: Start the built CLI
        if: env.SELECTED == 'true'
        run: npm run start --workspace "$WORKSPACE" -- --help
