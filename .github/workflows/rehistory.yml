name: Toolchain checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.12.0'
      - name: Install checksum-pinned official Gitleaks
        shell: node {0}
        run: |
          const { createHash } = require('node:crypto');
          const { mkdtempSync, writeFileSync, appendFileSync } = require('node:fs');
          const { join } = require('node:path');
          const { execFileSync } = require('node:child_process');
          async function install() {
            const directory = mkdtempSync(join(process.env.RUNNER_TEMP, 'gitleaks-'));
            const response = await fetch('https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz', { signal: AbortSignal.timeout(60000) });
            if (!response.ok) throw new Error('Gitleaks download failed');
            const chunks = [];
            let size = 0;
            for await (const chunk of response.body) {
              size += chunk.length;
              if (size > 32 * 1024 * 1024) throw new Error('Gitleaks download exceeds size limit');
              chunks.push(chunk);
            }
            const bytes = Buffer.concat(chunks);
            if (createHash('sha256').update(bytes).digest('hex') !== '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb') throw new Error('Gitleaks checksum mismatch');
            const archive = join(directory, 'gitleaks.tar.gz');
            writeFileSync(archive, bytes, { flag: 'wx', mode: 0o600 });
            execFileSync('tar', ['-xzf', archive, '-C', directory, 'gitleaks'], { timeout: 15000 });
            appendFileSync(process.env.GITHUB_PATH, directory + '\n');
          }
          install().catch((error) => { console.error(error.message); process.exitCode = 1; });
      - run: npm ci --ignore-scripts
      - run: npm run hooks:check
      - run: npm run test:hooks
      - run: npm run gitleaks:history
      - run: npm run gitleaks:files
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24.12.0', '26']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Build pinned modern Git on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$(mktemp -d)"
          cd "$build_dir"
          curl --fail --silent --show-error --location https://www.kernel.org/pub/software/scm/git/git-2.56.0.tar.xz -o git.tar.xz
          echo '26c56c296b38c0695b26fa95f475f1d01704d2d38e73465ca30b0b2f5dc789d3  git.tar.xz' | sha256sum --check
          tar -xf git.tar.xz
          make -C git-2.56.0 -j2 prefix="$build_dir/install" NO_RUST=YesPlease NO_CURL=YesPlease NO_OPENSSL=YesPlease NO_TCLTK=YesPlease NO_GETTEXT=YesPlease NO_PERL=YesPlease NO_PYTHON=YesPlease install
          echo "$build_dir/install/bin" >> "$GITHUB_PATH"
      - run: node --version
      - run: git --version
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node apps/reHistory/dist/src/cli.js --help
