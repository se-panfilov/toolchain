name: reHistory checks
on:
  pull_request:
    paths: ['apps/reHistory/**', '.github/workflows/rehistory.yml', '.gitattributes']
  push:
    paths: ['apps/reHistory/**', '.github/workflows/rehistory.yml', '.gitattributes']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24.12.0', '26']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/reHistory
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Build pinned modern Git on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$(mktemp -d)"
          cd "$build_dir"
          curl --fail --silent --show-error --location https://www.kernel.org/pub/software/scm/git/git-2.56.0.tar.xz -o git.tar.xz
          echo '26c56c296b38c0695b26fa95f475f1d01704d2d38e73465ca30b0b2f5dc789d3  git.tar.xz' | sha256sum --check
          tar -xf git.tar.xz
          make -C git-2.56.0 -j2 prefix="$build_dir/install" NO_RUST=YesPlease NO_CURL=YesPlease NO_OPENSSL=YesPlease NO_TCLTK=YesPlease NO_GETTEXT=YesPlease NO_PERL=YesPlease NO_PYTHON=YesPlease install
          echo "$build_dir/install/bin" >> "$GITHUB_PATH"
      - run: node --version
      - run: git --version
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: node dist/src/cli.js --help
