name: Secrets
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.12.0'
          package-manager-cache: false
      - name: Install checksum-pinned official Gitleaks
        shell: node {0}
        run: |
          const { createHash } = require('node:crypto');
          const { mkdtempSync, writeFileSync, appendFileSync } = require('node:fs');
          const { join } = require('node:path');
          const { execFileSync } = require('node:child_process');
          async function install() {
            const directory = mkdtempSync(join(process.env.RUNNER_TEMP, 'gitleaks-'));
            const response = await fetch('https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz', { signal: AbortSignal.timeout(60000) });
            if (!response.ok) throw new Error('Gitleaks download failed');
            const chunks = [];
            let size = 0;
            for await (const chunk of response.body) {
              size += chunk.length;
              if (size > 32 * 1024 * 1024) throw new Error('Gitleaks download exceeds size limit');
              chunks.push(chunk);
            }
            const bytes = Buffer.concat(chunks);
            if (createHash('sha256').update(bytes).digest('hex') !== '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb') throw new Error('Gitleaks checksum mismatch');
            const archive = join(directory, 'gitleaks.tar.gz');
            writeFileSync(archive, bytes, { flag: 'wx', mode: 0o600 });
            execFileSync('tar', ['-xzf', archive, '-C', directory, 'gitleaks'], { timeout: 15000 });
            appendFileSync(process.env.GITHUB_PATH, directory + '\n');
          }
          install().catch((error) => { console.error(error.message); process.exitCode = 1; });
      - run: npm ci --ignore-scripts
      - run: npm run hooks:check
      - run: npm run test:hooks
      - run: npm run gitleaks:history
      - run: npm run gitleaks:files
